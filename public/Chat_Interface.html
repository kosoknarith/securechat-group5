<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureChat</title>
  <link rel="stylesheet" href="Chat_Interface.css">
</head>

<body>

<div class="chat-container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Users</h2>
      <div id="meLabel" class="me-label"></div>
    </div>
    <ul id="usersList"></ul>
  </aside>

  <!-- Chat -->
  <div class="chat-main">
    <header class="chat-header">
      <div class="chat-title-wrap">
        <span id="chatTitle">General</span>
        <span id="connStatus" class="conn-status conn-connecting" title="Connection status">connecting...</span>
      </div>
      <div class="chat-header-actions">
        <button id="clearHistoryBtn" title="Delete saved chat history on this browser">Clear History</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="chat-messages" id="messages"></main>

    <div id="typingIndicator" class="typing">Typing...</div>

    <footer class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />

      <!-- Emoji button + popup -->
      <button type="button" id="emojiBtn" title="Insert emoji">😊</button>
      <div id="emojiPicker" class="emoji-picker" hidden></div>

      <button id="sendBtn">Send</button>
      <input type="file" id="fileInput" hidden />
      <label for="fileInput" id="attachFileBtn" title="Attach file">📎</label>
      <span id="fileName" class="file-name">No file chosen</span>
      <button id="sendFileBtn">Send File</button>
    </footer>

  </div>

</div>

<script src="config.js"></script>
<script type="module" src="Chat_Interface.js"></script>
</body>
</html>
