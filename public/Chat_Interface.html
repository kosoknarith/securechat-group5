<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureChat</title>
  <link rel="stylesheet" href="Chat_Interface.css">
</head>

<body>

<div class="chat-container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Users</h2>
    <ul id="usersList"></ul>
  </aside>

  <!-- Chat Interface -->
  <div class="chat-main">
    <header class="chat-header">
      <span id="chatTitle">General</span>
      <button id="logoutBtn">Logout</button>
    </header>

    <main class="chat-messages" id="messages"></main>

    <!-- Typing Indicator -->
   <div id="typingIndicator" class="typing">Typing...</div>

    <footer class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
      <input type="file" id="fileInput" hidden />
      <label for="fileInput" id="attachFileBtn" title="Attach File">📎</label>
      <span id="fileName" class="file-name">No file chosen</span>
      <button id="sendFileBtn">Send File</button>
    </footer>

  </div>

</div>

<script type="module" src="Chat_Interface.js"></script>
</body>
</html>
