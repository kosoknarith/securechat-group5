<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="login.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - SecureChat</title>
</head>

<body>

  <header class="top-header">
    Create a new account
  </header>

  <div class="login-container">
    <main class="login-main">
      <div class="login-card">

        <h2>Register</h2>

        <form id="registerForm">
          <input type="text" id="username" placeholder="Username" autocomplete="username" required />
          <input type="password" id="password" placeholder="Password" autocomplete="new-password" required />
          <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required />
          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAADLA3D84uqM0g9fO">
          </div>

          <button type="submit" id="registerBtn">Create Account</button>
        </form>

        <div id="status" role="status" aria-live="polite" class="status-msg"></div>

        <p class="alt-link">
          Already have an account?
          <a href="login.html">Sign in</a>
        </p>

      </div>
    </main>
  </div>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="config.js"></script>
  <script type="module" src="register.js"></script>
</body>
</html>
