<!doctype html>
<html>
  <body>
    <h3>SecureChat - Login</h3>

    <input id="user" placeholder="Username" />
    <input id="pass" placeholder="Password" type="password" />
    <button onclick="login()">Login</button>

    <pre id="log"></pre>

    <script>
      const log = (t) => (document.getElementById("log").textContent += t + "\n");

      // We authenticate by opening a WS connection, sending auth, and waiting for auth_ok.
      function login() {
        const username = document.getElementById("user").value.trim();
        const password = document.getElementById("pass").value;

        if (!username || !password) {
          log("Please enter username and password");
          return;
        }
        sessionStorage.setItem("username", username);
        sessionStorage.setItem("password", password);
        window.location.href = "chat.html";

        const ws = new WebSocket("ws://localhost:8080");

        ws.onopen = () => {
          ws.send(JSON.stringify({ type: "auth", username, password }));
        };

        ws.onmessage = (e) => {
          let msg;
          try { msg = JSON.parse(e.data); } catch { return; }

          if (msg.type === "auth_ok") {
            // Save login info for next page (simple for class demo)
            sessionStorage.setItem("username", username);
            sessionStorage.setItem("password", password);

            ws.close();
            window.location.href = "chat.html";
          } else if (msg.type === "auth_fail") {
            log("Login failed.");
            ws.close();
          }
        };

        ws.onerror = () => log("Connection error.");
      }
    </script>
  </body>
</html>
